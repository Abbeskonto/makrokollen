<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Makrokollen</title>
<meta name="description" content="Räkna kalorier, macros och micros med Livsmedelsverkets databas.">
<meta name="theme-color" content="#f3f6f2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f1512" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Makrokollen">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: one-column mobile app, sticky date header, fixed bottom tab bar, full-screen sheets */
:root{
  --bg:#f3f6f2; --surface:#ffffff; --surface2:#e9eee8; --fg:#17211b; --muted:#5e6b62; --line:#d7ded6;
  --accent:#1d6b47; --accent-fg:#ffffff;
  --prot:#2f6fd0; --carb:#c98a12; --fat:#c4456a; --kcal:#1d6b47;
  --low:#b7791f; --ok:#1d6b47; --over:#b42318;
  --display:"Bricolage Grotesque",ui-rounded,system-ui,sans-serif;
  --body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1512; --surface:#18201b; --surface2:#222c26; --fg:#e6ede7; --muted:#9aa89e; --line:#2c3730;
  --accent:#4fbf86; --accent-fg:#06140c; --prot:#6aa0f0; --carb:#e8b04a; --fat:#ee7c9c; --kcal:#4fbf86;
  --low:#e0a63e; --ok:#4fbf86; --over:#f0705f; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1512; --surface:#18201b; --surface2:#222c26; --fg:#e6ede7; --muted:#9aa89e; --line:#2c3730;
  --accent:#4fbf86; --accent-fg:#06140c; --prot:#6aa0f0; --carb:#e8b04a; --fat:#ee7c9c; --kcal:#4fbf86;
  --low:#e0a63e; --ok:#4fbf86; --over:#f0705f; color-scheme:dark}
*{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
[hidden]{display:none!important}
img{max-width:100%}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 calc(96px + env(safe-area-inset-bottom,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);padding-block:12px 10px;display:flex;align-items:center;gap:8px}
.brand{font-family:var(--display);font-weight:700;font-size:20px;letter-spacing:-.01em;flex:1;min-width:0}
.datenav{display:flex;align-items:center;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px}
.datenav button{border:0;background:none;width:32px;height:32px;border-radius:999px;font-size:18px;line-height:1}
.datenav button:hover{background:var(--surface2)}
.datenav .d{min-width:88px;text-align:center;font-weight:600;font-size:14px;background:none;border:0;padding:0 4px}
h2{font-family:var(--display);font-weight:600;font-size:17px;margin:0;letter-spacing:-.005em;text-wrap:balance}
.lbl{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.view{display:flex;flex-direction:column;gap:16px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}

/* Summary */
.summary{display:grid;grid-template-columns:132px 1fr;gap:16px;align-items:center}
.ring{position:relative;width:132px;height:132px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.ring .big{font-family:var(--display);font-weight:700;font-size:28px;line-height:1}
.ring .sub{font-size:12px;color:var(--muted)}
.macros{display:flex;flex-direction:column;gap:10px;min-width:0}
.mrow .top{display:flex;justify-content:space-between;gap:8px;font-size:13px}
.mrow .top b{font-weight:600}
.mrow .top span{color:var(--muted)}
.bar{height:8px;border-radius:99px;background:var(--surface2);overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;border-radius:99px;transition:width .3s}
.left{font-size:13px;color:var(--muted);margin-top:12px;padding-top:12px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}

/* Meals */
.meal{padding:0;overflow:hidden}
.meal .mh{display:flex;align-items:center;gap:10px;padding:12px 16px}
.meal .mh h2{flex:1}
.meal .mh .k{font-size:13px;color:var(--muted)}
.addbtn{border:1px solid var(--line);background:var(--surface2);border-radius:999px;padding:4px 12px;font-size:13px;font-weight:600}
.item{display:flex;align-items:center;gap:12px;padding:10px 16px;border-top:1px solid var(--line);width:100%;text-align:left;background:none;border-left:0;border-right:0;border-bottom:0}
.item:hover{background:var(--surface2)}
.item .n{flex:1;min-width:0}
.item .n div:first-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}
.item .n div:last-child{font-size:12px;color:var(--muted)}
.item .kc{font-weight:600;font-size:14px}
.dots{display:inline-flex;gap:8px}
.dots b{font-weight:500}
.p{color:var(--prot)} .cc{color:var(--carb)} .f{color:var(--fat)}
.empty{padding:16px;color:var(--muted);font-size:14px;display:flex;flex-direction:column;gap:10px;align-items:flex-start}

/* Tabs */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
nav.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);align-items:center}
nav.tabs button{border:0;background:none;padding:8px 0 10px;font-size:11px;font-weight:600;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button[aria-current="page"]{color:var(--accent)}
nav.tabs .plus{justify-self:center;width:52px;height:52px;border-radius:999px;background:var(--accent);color:var(--accent-fg);display:flex;align-items:center;justify-content:center;padding:0;margin-top:-18px;box-shadow:0 4px 14px rgb(0 0 0 / .18)}
nav.tabs .plus svg{width:26px;height:26px}

/* Micros */
.mic{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:baseline;padding:8px 0;border-top:1px solid var(--line)}
.mic:first-of-type{border-top:0}
.mic .nm{font-weight:500}
.mic .vl{font-size:13px;color:var(--muted);text-align:right}
.mic .bar{grid-column:1 / -1;margin-top:0;height:6px}
.pct{font-weight:600;color:var(--fg)}
.note{font-size:12px;color:var(--muted)}

/* History */
.chart{display:flex;align-items:flex-end;gap:6px;height:160px;position:relative;padding-top:8px}
.chart .col{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end;min-width:0}
.chart .col i{width:100%;max-width:28px;border-radius:6px 6px 2px 2px;background:var(--accent);opacity:.85}
.chart .col.over i{background:var(--over)}
.chart .col.today i{opacity:1}
.chart .col span{font-size:10px;color:var(--muted)}
.chart .goal{position:absolute;left:0;right:0;border-top:1.5px dashed var(--muted);opacity:.6}
.chart .goal em{position:absolute;right:0;top:-18px;font-size:10px;font-style:normal;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}
.stats div{display:flex;flex-direction:column}
.stats b{font-family:var(--display);font-size:18px}
.stats span{font-size:11px;color:var(--muted)}

/* Forms */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:12px;font-weight:600;color:var(--muted)}
input[type=text],input[type=number],input[type=search],select{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:16px;min-width:0}
.seg{display:flex;background:var(--surface2);border-radius:10px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:none;border-radius:8px;padding:8px 6px;font-size:14px;font-weight:500}
.seg button[aria-pressed="true"]{background:var(--surface);box-shadow:0 1px 2px rgb(0 0 0 / .12);font-weight:600}
.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:600;background:var(--accent);color:var(--accent-fg)}
.btn.ghost{background:var(--surface2);color:var(--fg)}
.btn.danger{background:none;color:var(--over);border:1px solid var(--line)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.targets{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.targets .t{background:var(--surface2);border-radius:10px;padding:10px;display:flex;flex-direction:column}
.targets .t b{font-family:var(--display);font-size:20px}
.targets .t span{font-size:11px;color:var(--muted)}
.status{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.status i{width:8px;height:8px;border-radius:9px;background:var(--muted)}
.status.cloud i{background:var(--ok)}
textarea{width:100%;min-height:90px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px;font:12px/1.4 ui-monospace,monospace;color:var(--fg)}

/* Sheet */
.sheet{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column}
.sheet .sh{padding-top:calc(env(safe-area-inset-top,0px) + 10px);padding-bottom:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line);background:var(--bg)}
.sheet .sh h2{flex:1}
.sheet .sb{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.sheet .sb .in{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px calc(24px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
.x{border:0;background:var(--surface2);width:36px;height:36px;border-radius:999px;font-size:18px}
.res{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.res button{display:flex;gap:10px;align-items:center;text-align:left;padding:11px 14px;border:0;border-top:1px solid var(--line);background:none;width:100%}
.res button:first-child{border-top:0}
.res button:hover{background:var(--surface2)}
.res .n{flex:1;min-width:0}
.res .n div:last-child{font-size:12px;color:var(--muted)}
.searchrow{display:flex;gap:8px}
.searchrow input{flex:1}
.scanbtn{flex:none;width:46px;border:1px solid var(--line);background:var(--surface);border-radius:10px;display:flex;align-items:center;justify-content:center;color:var(--accent)}
.scanbtn svg{width:24px;height:24px}
#reader{width:100%;border-radius:var(--r);overflow:hidden;background:#000;min-height:240px;position:relative}
#reader video{width:100%!important;height:auto!important;display:block;object-fit:cover}
.tag.off{color:var(--muted)}
.res .tag{font-size:10px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--accent);border:1px solid currentColor;border-radius:4px;padding:0 4px;margin-left:6px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:14px}
.chips button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.label{background:var(--surface);border:2px solid var(--fg);border-radius:6px;padding:10px 12px}
.label h3{font-family:var(--display);font-size:20px;margin:0 0 2px}
.label .lr{display:flex;justify-content:space-between;padding:4px 0;border-top:1px solid var(--line);font-size:14px}
.label .lr.thick{border-top:6px solid var(--fg)}
.label .lr.ind{padding-left:14px;color:var(--muted)}
.gram{display:flex;align-items:center;gap:8px}
.gram input{font-size:22px;font-weight:600;text-align:center;max-width:120px}
.hint{background:var(--surface2);border-radius:12px;padding:12px 14px;font-size:13px;display:flex;gap:10px;align-items:flex-start}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:8px 14px;border-radius:999px;font-size:13px;font-weight:500;z-index:60}
@media (max-width:380px){.summary{grid-template-columns:110px 1fr}.ring{width:110px;height:110px}.ring .big{font-size:23px}.targets,.stats{grid-template-columns:repeat(2,1fr)}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <div class="brand">Makrokollen</div>
    <div class="datenav" id="datenav">
      <button id="prevDay" aria-label="Föregående dag">‹</button>
      <button class="d" id="dateLbl" aria-label="Gå till idag">Idag</button>
      <button id="nextDay" aria-label="Nästa dag">›</button>
    </div>
  </header>
  <main id="main" class="view"></main>
</div>

<nav class="tabs" aria-label="Huvudmeny"><div class="in">
  <button data-tab="dag" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="8"/><path d="M12 8v4l3 2"/></svg>Dag</button>
  <button data-tab="micros"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 3h6M10 3v6L5 19a1.5 1.5 0 0 0 1.3 2h11.4a1.5 1.5 0 0 0 1.3-2l-5-10V3"/><path d="M7.5 15h9"/></svg>Micros</button>
  <button class="plus" id="plusBtn" aria-label="Lägg till mat"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
  <button data-tab="historik"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 20V10M10 20V4M15 20v-7M20 20v-11"/></svg>Historik</button>
  <button data-tab="mal"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="4"/><circle cx="12" cy="12" r=".5"/></svg>Mål</button>
</div></nav>

<div id="sheetRoot"></div>
<div id="toastRoot"></div>

<script>
(()=>{
"use strict";
/* ---------- Nutrient definitions ---------- */
// Index positions follow foods.json "keys"
let KEYS=["kcal","p","c","f","fib","sug","sat","salt","vitA","vitD","vitE","vitC","b1","b2","b3","b6","fol","b12","ca","fe","mg","k","zn","se","i","ph","na","o3"];
const KI=k=>KEYS.indexOf(k);
// Reference intakes, adults, approx. NNR 2023 [man, kvinna]
const MICROS=[
 {g:"Vitaminer",k:"vitA",n:"Vitamin A",u:"µg",r:[900,700]},
 {g:"Vitaminer",k:"vitD",n:"Vitamin D",u:"µg",r:[10,10]},
 {g:"Vitaminer",k:"vitE",n:"Vitamin E",u:"mg",r:[11,10]},
 {g:"Vitaminer",k:"vitC",n:"Vitamin C",u:"mg",r:[110,95]},
 {g:"Vitaminer",k:"b1",n:"Tiamin (B1)",u:"mg",r:[1.2,1.0]},
 {g:"Vitaminer",k:"b2",n:"Riboflavin (B2)",u:"mg",r:[1.6,1.3]},
 {g:"Vitaminer",k:"b3",n:"Niacin (B3)",u:"mg",r:[16,14]},
 {g:"Vitaminer",k:"b6",n:"Vitamin B6",u:"mg",r:[1.8,1.6]},
 {g:"Vitaminer",k:"fol",n:"Folat",u:"µg",r:[330,330]},
 {g:"Vitaminer",k:"b12",n:"Vitamin B12",u:"µg",r:[4,4]},
 {g:"Mineraler",k:"ca",n:"Kalcium",u:"mg",r:[950,950]},
 {g:"Mineraler",k:"fe",n:"Järn",u:"mg",r:[9,15]},
 {g:"Mineraler",k:"mg",n:"Magnesium",u:"mg",r:[350,300]},
 {g:"Mineraler",k:"k",n:"Kalium",u:"mg",r:[3500,3500]},
 {g:"Mineraler",k:"zn",n:"Zink",u:"mg",r:[11,8]},
 {g:"Mineraler",k:"se",n:"Selen",u:"µg",r:[90,75]},
 {g:"Mineraler",k:"i",n:"Jod",u:"µg",r:[150,150]},
 {g:"Mineraler",k:"ph",n:"Fosfor",u:"mg",r:[700,700]},
 {g:"Övrigt",k:"fib",n:"Fiber",u:"g",r:[35,25]},
 {g:"Övrigt",k:"sug",n:"Sockerarter",u:"g",r:null},
 {g:"Övrigt",k:"sat",n:"Mättat fett",u:"g",r:null,limitPct:.10},
 {g:"Övrigt",k:"salt",n:"Salt",u:"g",r:null,limit:6},
];
const MEALS=[["frukost","Frukost"],["lunch","Lunch"],["middag","Middag"],["mellan","Mellanmål"]];
const ACT=[[1.2,"Stillasittande","ingen träning"],[1.375,"Lätt aktiv","1–3 pass/vecka"],[1.55,"Aktiv","3–5 pass/vecka"],[1.725,"Mycket aktiv","6–7 pass/vecka"],[1.9,"Extremt aktiv","fysiskt jobb + träning"]];
const GOALS=[[-500,"Gå ner","≈ −0,5 kg/v"],[-250,"Gå ner lugnt","≈ −0,25 kg/v"],[0,"Behålla",""],[300,"Gå upp","≈ +0,25 kg/v"]];

/* ---------- State ---------- */
const LS="makrokollen.v1";
const blank=()=>({profile:{sex:"m",age:30,height:180,weight:80,act:1.55,goal:0,over:{}},days:{},custom:[],recent:[],last:{},prod:{}});
let S=blank();
try{const raw=localStorage.getItem(LS); if(raw){S=Object.assign(blank(),JSON.parse(raw));}}catch(e){}
let FOODS=new Map(), FLIST=[], foodsReady=false;
let tab="dag", day=todayKey();

function todayKey(d=new Date()){const z=n=>String(n).padStart(2,"0");return d.getFullYear()+"-"+z(d.getMonth()+1)+"-"+z(d.getDate());}
function addDays(k,n){const [y,m,d]=k.split("-").map(Number);return todayKey(new Date(y,m-1,d+n));}
function dayLabel(k){
  const t=todayKey(); if(k===t) return "Idag"; if(k===addDays(t,-1)) return "Igår"; if(k===addDays(t,1)) return "Imorgon";
  const [y,m,d]=k.split("-").map(Number); return new Date(y,m-1,d).toLocaleDateString("sv-SE",{weekday:"short",day:"numeric",month:"short"});
}
const uid=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4);
const fmt=(v,d=0)=>(Math.round(v*10**d)/10**d).toLocaleString("sv-SE",{minimumFractionDigits:0,maximumFractionDigits:d});
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const DIA=/[\u0300-\u036f]/g;
const norm=s=>s.toLowerCase().normalize("NFD").replace(DIA,"");

/* ---------- Targets ---------- */
function calcTargets(p=S.profile){
  const bmr=10*p.weight+6.25*p.height-5*p.age+(p.sex==="m"?5:-161);
  const tdee=bmr*p.act;
  const kcal=Math.max(1200,Math.round((tdee+p.goal)/10)*10);
  const prot=Math.round(p.weight*(p.goal<0?2.0:1.8));
  const fat=Math.round(kcal*0.27/9);
  const carb=Math.max(0,Math.round((kcal-prot*4-fat*9)/4));
  const auto={kcal,p:prot,c:carb,f:fat};
  const o=p.over||{};
  return {bmr:Math.round(bmr),tdee:Math.round(tdee),auto,kcal:o.kcal||kcal,p:o.p||prot,c:o.c||carb,f:o.f||fat};
}

/* ---------- Foods ---------- */
// Open Food Facts products: fid "o:<barcode>". Data from off.json (OFF map) or saved in S.prod once used/looked up online.
const OFF=new Map(), OLIST=[]; let offReady=false;
const MACK=["kcal","p","c","f","fib","sug","sat","salt"];
function offVec(mac,mic){const v=new Array(KEYS.length).fill(0);MACK.forEach((k,i)=>{v[KI(k)]=+mac[i]||0;});if(mic)for(const k in mic){const i=KI(k);if(i>=0)v[i]=+mic[k]||0;}return v;}
function offRow(code){return OFF.get(code)||S.prod[code]||null;}
function isOff(fid){return typeof fid==="string"&&fid.startsWith("o:");}
function isCustom(fid){return typeof fid==="string"&&fid.startsWith("c:");}
function parseFid(s){return s.startsWith("c:")||s.startsWith("o:")?s:+s;}
function foodVals(fid){
  if(isCustom(fid)){const c=S.custom.find(x=>x.id===fid);return c?KEYS.map(k=>+c[k]||0):null;}
  if(isOff(fid)){const o=offRow(fid.slice(2));return o?o.v:null;}
  const f=FOODS.get(fid); return f?f.v:null;
}
function foodName(fid){
  if(isCustom(fid)){const c=S.custom.find(x=>x.id===fid);return c?c.name:"Borttaget livsmedel";}
  if(isOff(fid)){const o=offRow(fid.slice(2));return o?o.name+(o.brand?", "+o.brand:""):(offReady?"Okänd vara":"Laddar…");}
  const f=FOODS.get(fid); return f?f.name:(foodsReady?"Okänt livsmedel":"Laddar…");
}
function sumItems(items){
  const t=new Array(KEYS.length).fill(0);
  for(const it of items){const v=foodVals(it.fid); if(!v) continue; for(let i=0;i<v.length;i++) t[i]+=v[i]*it.g/100;}
  return t;
}
function search(q){
  const toks=norm(q.trim()).split(/\s+/).filter(Boolean); if(!toks.length) return [];
  const pool=[...S.custom.map(c=>({fid:c.id,name:c.name,nn:norm(c.name),custom:true})),...FLIST,...OLIST];
  const out=[];
  for(const f of pool){
    let score=0,ok=true;
    for(const t of toks){
      const i=f.nn.indexOf(t); if(i<0){ok=false;break;}
      score+= i===0?0:(f.nn[i-1]===" "||f.nn[i-1]===","||f.nn[i-1]==="-")?1:3;
    }
    if(ok) out.push([score+(f.custom?-1:0)+(f.off?.4:0)+f.nn.length/200+(S.recent.includes(f.fid)?-.5:0),f]);
  }
  out.sort((a,b)=>a[0]-b[0]); return out.slice(0,60).map(x=>x[1]);
}

/* ---------- Persistence: local + cloud (claude db) ---------- */
let cloud=null; // {db,id,ready}
const dirty=new Set(); let flushT=null, writing=false;
function saveLocal(){try{localStorage.setItem(LS,JSON.stringify(S));}catch(e){}}
function touch(docKey){ saveLocal(); if(cloud){dirty.add(docKey); clearTimeout(flushT); flushT=setTimeout(flush,700);} }
function docBody(key){
  if(key==="profile") return {profile:S.profile,custom:S.custom,recent:S.recent,last:S.last};
  return {date:key.slice(4),items:S.days[key.slice(4)]||[]};
}
async function flush(){
  if(!cloud||writing) return; writing=true;
  try{
    while(dirty.size){
      const key=dirty.values().next().value; dirty.delete(key);
      const ref=cloud.db.doc("data/users/"+cloud.id+"/"+key);
      try{
        if(key.startsWith("day-")&&!(S.days[key.slice(4)]||[]).length) await ref.delete();
        else await ref.set(docBody(key));
      }catch(e){ if(e&&e.code==="invalid_argument"){cloud=null;renderStatus();break;} dirty.add(key); await new Promise(r=>setTimeout(r,1500)); }
    }
  }finally{writing=false;}
}

const $=s=>document.querySelector(s);
const main=$("#main");
function ring(val,goal){
  const r=56,c=2*Math.PI*r,pct=Math.min(1,goal?val/goal:0),over=val>goal*1.05;
  return `<div class="ring"><svg viewBox="0 0 132 132"><circle cx="66" cy="66" r="${r}" fill="none" stroke="var(--surface2)" stroke-width="12"/><circle cx="66" cy="66" r="${r}" fill="none" stroke="${over?"var(--over)":"var(--kcal)"}" stroke-width="12" stroke-linecap="round" stroke-dasharray="${c*pct} ${c}" opacity="${pct>0?1:0}"/></svg><div class="c"><div class="big num">${fmt(val)}</div><div class="sub num">av ${fmt(goal)} kcal</div></div></div>`;
}
function mrow(name,cls,val,goal){
  const pct=goal?Math.min(100,val/goal*100):0;
  return `<div class="mrow"><div class="top"><b class="${cls}">${name}</b><span class="num">${fmt(val)} / ${fmt(goal)} g</span></div><div class="bar"><i style="width:${pct}%;background:var(--${cls==="cc"?"carb":cls==="p"?"prot":"fat"})"></i></div></div>`;
}

  }

}
function renderMicros(){
  const items=S.days[day]||[]; const t=sumItems(items); const sx=S.profile.sex==="m"?0:1; const T=calcTargets();
  let h=`<section class="panel"><h2>Mikronäring ${dayLabel(day).toLowerCase()==="idag"?"idag":dayLabel(day)}</h2><p class="note" style="margin:4px 0 0">Jämfört med rekommenderat dagligt intag för ${S.profile.sex==="m"?"män":"kvinnor"} (ungefärliga värden enligt Nordiska näringsrekommendationer 2023).</p></section>`;
  let g="";
  for(const m of MICROS){
    if(m.g!==g){ if(g) h+=`</section>`; g=m.g; h+=`<section class="panel"><div class="lbl" style="margin-bottom:4px">${g}</div>`; }
    const v=t[KI(m.k)]||0; let goal=m.r?m.r[sx]:null, pct=null, color="var(--ok)", txt;
    if(goal){pct=v/goal*100; color=pct>=100?"var(--ok)":pct>=50?"var(--accent)":"var(--low)"; txt=`${fmt(v,v<10?1:0)} / ${fmt(goal,goal<10?1:0)} ${m.u} · <span class="pct">${fmt(pct)} %</span>`;}
    else if(m.limit){pct=v/m.limit*100; color=pct>100?"var(--over)":"var(--muted)"; txt=`${fmt(v,1)} ${m.u} · max ${m.limit} ${m.u}`;}
    else if(m.limitPct){const lim=T.kcal*m.limitPct/9; pct=v/lim*100; color=pct>100?"var(--over)":"var(--muted)"; txt=`${fmt(v,1)} ${m.u} · max ≈${fmt(lim)} ${m.u}`;}
    else txt=`${fmt(v,1)} ${m.u}`;
    h+=`<div class="mic"><span class="nm">${m.n}</span><span class="vl num">${txt}</span>${pct!==null?`<div class="bar"><i style="width:${Math.min(100,pct)}%;background:${color}"></i></div>`:""}</div>`;
  }
  h+=`</section>`;
  if(!items.length) h=`<div class="empty">Logga mat för att se vitaminer och mineraler.</div>`+h;
  main.innerHTML=h;
}
function renderHist(){
  const T=calcTargets(); const days=[];
  for(let i=13;i>=0;i--){const k=addDays(day,-i);const t=sumItems(S.days[k]||[]);days.push({k,kc:t[0],p:t[1],c:t[2],f:t[3],n:(S.days[k]||[]).length});}
  const max=Math.max(T.kcal*1.25,...days.map(d=>d.kc));
  const logged=days.filter(d=>d.n);
  const avg=k=>logged.length?logged.reduce((s,d)=>s+d[k],0)/logged.length:0;
  let h=`<section class="panel"><h2>Senaste 14 dagarna</h2><p class="note" style="margin:2px 0 10px">Kalorier per dag. Streckad linje är ditt mål.</p><div class="chart" role="img" aria-label="Kalorier per dag">`;
  h+=`<div class="goal" style="bottom:${T.kcal/max*100*(152/160)+12}px"><em class="num">${fmt(T.kcal)}</em></div>`;
  for(const d of days){const [y,m,dd]=d.k.split("-").map(Number);
    h+=`<div class="col ${d.kc>T.kcal*1.05?"over":""} ${d.k===day?"today":""}" title="${d.k}: ${fmt(d.kc)} kcal"><i style="height:${d.kc/max*(152-16)}px"></i><span class="num">${dd}</span></div>`;}
  h+=`</div><div class="stats num"><div><b>${fmt(avg("kc"))}</b><span>snitt kcal</span></div><div><b class="p">${fmt(avg("p"))}</b><span>snitt protein g</span></div><div><b class="cc">${fmt(avg("c"))}</b><span>snitt kolh. g</span></div><div><b class="f">${fmt(avg("f"))}</b><span>snitt fett g</span></div></div><p class="note" style="margin:10px 0 0">Snitten räknas på de ${logged.length} dagar du har loggat.</p></section>`;
  main.innerHTML=h;
}

function guessMeal(){const h=new Date().getHours();return h<10?"frukost":h<14?"lunch":h<17?"mellan":h<21?"middag":"mellan";}

function openAdd(meal=guessMeal(),q=""){
  sheet("Lägg till mat",`<div class="searchrow"><input type="search" id="q" placeholder="Sök vara eller märke, t.ex. kvarg arla" autocomplete="off" value="${esc(q)}" enterkeyhint="search" aria-label="Sök"><button class="scanbtn" id="scanBtn" aria-label="Skanna streckkod"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 7V5a2 2 0 0 1 2-2h2M17 3h2a2 2 0 0 1 2 2v2M21 17v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2"/><path d="M7 8v8M10 8v8M13 8v8M17 8v8"/></svg></button></div>
  <div class="chips" id="mealChips">${MEALS.map(([k,n])=>`<button data-m="${k}" aria-pressed="${k===meal}">${n}</button>`).join("")}</div>
  <div id="results"></div><div id="online"></div>`);
  const qi=$("#q"); let m=meal;
  $("#mealChips").querySelectorAll("button").forEach(b=>b.onclick=()=>{m=b.dataset.m;$("#mealChips").querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed",x===b));});
  $("#scanBtn").onclick=()=>openScan(m);
  const back=()=>openAdd(m,qi.value);
  const show=()=>{
    const v=qi.value; let list,head;
    $("#online").innerHTML="";
    if(!foodsReady){$("#results").innerHTML=`<p class="note">Laddar livsmedelsdatabasen…</p>`;return;}
    if(/^\d{8,14}$/.test(v.trim())){$("#results").innerHTML=`<div class="res"><button id="byCode"><div class="n"><div>Slå upp streckkod ${esc(v.trim())}</div><div>Söker bland märkesvaror</div></div></button></div>`;$("#byCode").onclick=()=>lookupCode(v.trim(),m,back);return;}
    if(v.trim()){list=search(v);head=list.length?"":`<p class="note">Hittade inget på ”${esc(v)}” i appen. Prova ett kortare ord, sök online nedan, eller skanna streckkoden.</p>`;}
    else{list=S.recent.map(fid=>({fid,name:foodName(fid),custom:isCustom(fid),off:isOff(fid)})).filter(x=>foodVals(x.fid));head=list.length?`<div class="lbl">Senast använda</div>`:`<p class="note">Skriv för att söka bland ${fmt(FLIST.length+OLIST.length)} livsmedel och varor, eller tryck på streckkodsknappen för att skanna.</p>`;}
    $("#results").innerHTML=head+(list.length?`<div class="res">${list.map(f=>{const vv=foodVals(f.fid);return `<button data-f="${esc(f.fid)}"><div class="n"><div>${esc(f.off?foodName(f.fid):f.name)}${f.custom?`<span class="tag">Eget</span>`:""}</div><div class="num">${fmt(vv[0])} kcal · P ${fmt(vv[1],1)} · K ${fmt(vv[2],1)} · F ${fmt(vv[3],1)} /100 g</div></div></button>`;}).join("")}</div>`:"");
    $("#results").querySelectorAll("[data-f]").forEach(b=>b.onclick=()=>openPortion(parseFid(b.dataset.f),{meal:m,back}));
    if(v.trim().length>=3) {$("#online").innerHTML=`<button class="btn ghost" id="onl" style="width:100%">Sök ”${esc(v.trim())}” online i Open Food Facts</button>`;$("#onl").onclick=()=>searchOnline(v.trim(),m,back);}
  };
  let t; qi.oninput=()=>{clearTimeout(t);t=setTimeout(show,80);};
  show(); setTimeout(()=>qi.focus(),50);
}

function openPortion(fid,{meal,back,item}={}){
  const v=foodVals(fid); if(!v) return;
  let g=item?item.g:(S.last[fid]||100), m=item?item.meal:meal;
  const name=foodName(fid);
  const o=isOff(fid)?offRow(fid.slice(2)):null, cu=isCustom(fid)?S.custom.find(x=>x.id===fid):null;
  const src=typeof fid==="number"?`Livsmedelsverket nr ${fid}`:o?`Open Food Facts · streckkod ${fid.slice(2)}`:`Eget livsmedel${cu&&cu.ean?` · streckkod ${cu.ean}`:""}`;
  const sq=o&&o.sq?o.sq:0;
  if(!item&&!S.last[fid]&&sq) g=sq;
  sheet(item?"Ändra":name.length>28?"Mängd":name,`<div><h2 style="font-size:20px">${esc(name)}</h2><span class="note">${esc(src)}</span>${o&&!o.mic?`<div class="note">Förpackningen anger inga vitaminer eller mineraler, så varan ger inget tillskott i micros-fliken.</div>`:""}</div>
  <div class="gram"><button class="x" id="gMinus" aria-label="Minska">−</button><input id="g" type="number" inputmode="decimal" value="${g}" aria-label="Gram"><span>gram</span><button class="x" id="gPlus" aria-label="Öka">+</button></div>
  <div class="chips" id="gChips">${sq?`<button data-g="${sq}">1 portion (${fmt(sq)} g)</button>`:""}${[25,50,100,150,200,300].map(x=>`<button data-g="${x}">${x} g</button>`).join("")}</div>
  <div class="chips" id="mChips">${MEALS.map(([k,n])=>`<button data-m="${k}" aria-pressed="${k===m}">${n}</button>`).join("")}</div>
  <div class="label" id="lab"></div>
  <div class="row"><button class="btn" id="save" style="flex:1">${item?"Spara":"Lägg till"}</button>${item?`<button class="btn danger" id="del">Ta bort</button>`:""}</div>`, back||null);
  const gi=$("#g");
  const upd=()=>{const gg=Math.max(0,parseFloat(gi.value)||0),r=gg/100,x=k=>v[KI(k)]*r;
    const top=MICROS.filter(mm=>mm.r).map(mm=>[mm,x(mm.k)/mm.r[S.profile.sex==="m"?0:1]]).sort((a,b)=>b[1]-a[1]).slice(0,4).filter(z=>z[1]>=.05);
    $("#lab").innerHTML=`<h3>Näringsvärde</h3><div class="note" style="margin-bottom:6px">för ${fmt(gg)} g</div>
    <div class="lr thick"><b>Energi</b><b class="num">${fmt(x("kcal"))} kcal</b></div>
    <div class="lr"><span>Fett</span><span class="num">${fmt(x("f"),1)} g</span></div><div class="lr ind"><span>varav mättat</span><span class="num">${fmt(x("sat"),1)} g</span></div>
    <div class="lr"><span>Kolhydrater</span><span class="num">${fmt(x("c"),1)} g</span></div><div class="lr ind"><span>varav sockerarter</span><span class="num">${fmt(x("sug"),1)} g</span></div>
    <div class="lr"><span>Fiber</span><span class="num">${fmt(x("fib"),1)} g</span></div>
    <div class="lr"><span>Protein</span><span class="num">${fmt(x("p"),1)} g</span></div>
    <div class="lr"><span>Salt</span><span class="num">${fmt(x("salt"),2)} g</span></div>
    ${top.length?`<div class="lr thick"><span class="lbl" style="padding-top:2px">Mest av</span><span></span></div>`+top.map(([mm,pc])=>`<div class="lr"><span>${mm.n}</span><span class="num">${fmt(pc*100)} % av dagsbehov</span></div>`).join(""):""}`;};
  gi.oninput=upd; upd();
  $("#gMinus").onclick=()=>{gi.value=Math.max(0,(parseFloat(gi.value)||0)-10);upd();};
  $("#gPlus").onclick=()=>{gi.value=(parseFloat(gi.value)||0)+10;upd();};
  $("#gChips").querySelectorAll("button").forEach(b=>b.onclick=()=>{gi.value=b.dataset.g;upd();});
  $("#mChips").querySelectorAll("button").forEach(b=>b.onclick=()=>{m=b.dataset.m;$("#mChips").querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed",x===b));});
  $("#save").onclick=()=>{
    const gg=Math.round((parseFloat(gi.value)||0)*10)/10; if(gg<=0){toast("Ange hur många gram");return;}
    const list=S.days[day]=S.days[day]||[];
    if(item){const it=list.find(x=>x.id===item.id); if(it){it.g=gg;it.meal=m;}}
    else list.push({id:uid(),fid,g:gg,meal:m});
    if(o) S.prod[fid.slice(2)]=o;
    S.last[fid]=gg; S.recent=[fid,...S.recent.filter(x=>x!==fid)].slice(0,25);
    touch("day-"+day); touch("profile"); closeSheet(); tab="dag"; render(); toast(item?"Sparat":`${name.split(",")[0]} tillagd i ${MEALS.find(x=>x[0]===m)[1].toLowerCase()}`);
  };
  if(item) $("#del").onclick=()=>{S.days[day]=(S.days[day]||[]).filter(x=>x.id!==item.id);touch("day-"+day);closeSheet();render();toast("Borttaget");};
}
function openEdit(id){const it=(S.days[day]||[]).find(x=>x.id===id); if(it) openPortion(it.fid,{item:it});}

function openCustom(id,{ean="",name="",meal=null,back=null,why=""}={}){
  const c=id?S.custom.find(x=>x.id===id):{name,ean,kcal:"",p:"",c:"",f:"",fib:"",sug:"",sat:"",salt:""};
  const F=[["kcal","Energi (kcal)"],["p","Protein (g)"],["c","Kolhydrater (g)"],["f","Fett (g)"],["fib","Fiber (g)"],["sug","varav socker (g)"],["sat","varav mättat fett (g)"],["salt","Salt (g)"]];
  sheet(id?"Ändra eget livsmedel":ean?"Ny vara":"Nytt livsmedel",`${why?`<div class="hint"><span>${esc(why)}</span></div>`:""}<div class="field"><label for="cName">Namn</label><input id="cName" type="text" value="${esc(c.name)}" placeholder="t.ex. Proteinpulver vanilj"></div>
  ${c.ean?`<span class="note">Streckkod ${esc(c.ean)}. Nästa gång du skannar den hittas varan direkt.</span>`:""}
  <p class="note" style="margin:0">Skriv värdena per 100 g, som på förpackningens näringsdeklaration.</p>
  <div class="grid2">${F.map(([k,l])=>`<div class="field"><label for="c_${k}">${l}</label><input id="c_${k}" type="number" inputmode="decimal" step="0.1" value="${c[k]??""}"></div>`).join("")}</div>
  <div class="row"><button class="btn" id="cSave" style="flex:1">${meal?"Spara och välj mängd":"Spara"}</button>${id?`<button class="btn danger" id="cDel">Ta bort</button>`:""}</div>`, back);
  $("#cSave").onclick=()=>{
    const name=$("#cName").value.trim(); if(!name){toast("Ge livsmedlet ett namn");return;}
    if(!(parseFloat($("#c_kcal").value)>=0)){toast("Fyll i energi (kcal)");return;}
    const o=id?c:{id:"c:"+uid()}; o.name=name; if(c.ean) o.ean=c.ean; for(const [k] of F) o[k]=parseFloat($("#c_"+k).value)||0;
    if(!id) S.custom.push(o); touch("profile");
    if(meal){openPortion(o.id,{meal});toast("Varan är sparad");return;}
    closeSheet(); render(); toast("Sparat");
  };
  if(id) $("#cDel").onclick=()=>{S.custom=S.custom.filter(x=>x.id!==id);touch("profile");closeSheet();render();toast("Borttaget");};
}

/* ---------- Open Food Facts online ---------- */
const OFF_FIELDS="code,product_name,product_name_sv,brands,nutriments,serving_quantity";
const OFF_MIC=[["vitA","vitamin-a",1e6],["vitD","vitamin-d",1e6],["vitE","vitamin-e",1e3],["vitC","vitamin-c",1e3],["b1","vitamin-b1",1e3],["b2","vitamin-b2",1e3],["b3","vitamin-pp",1e3],["b6","vitamin-b6",1e3],["fol","vitamin-b9",1e6],["b12","vitamin-b12",1e6],["ca","calcium",1e3],["fe","iron",1e3],["mg","magnesium",1e3],["k","potassium",1e3],["zn","zinc",1e3],["se","selenium",1e6],["i","iodine",1e6],["ph","phosphorus",1e3],["na","sodium",1e3]];
function offFromProduct(p){
  if(!p) return null; const n=p.nutriments||{};
  const num=k=>{const v=parseFloat(n[k+"_100g"]);return isFinite(v)&&v>=0?v:null;};
  let kc=num("energy-kcal"); if(kc===null&&num("energy")!==null) kc=num("energy")/4.184;
  const name=(p.product_name_sv||p.product_name||"").trim();
  if(kc===null||num("proteins")===null||num("fat")===null||num("carbohydrates")===null) return {incomplete:true,name,brand:(p.brands||"").split(",")[0].trim()};
  const mac=[Math.round(kc),num("proteins"),num("carbohydrates"),num("fat"),num("fiber")||0,num("sugars")||0,num("saturated-fat")||0,num("salt")||0];
  const mic={}; for(const [k,ok,f] of OFF_MIC){const v=num(ok); if(v) mic[k]=v*f;}
  const sq=parseFloat(p.serving_quantity);
  return {name:name||"Namnlös vara",brand:(p.brands||"").split(",")[0].trim(),sq:sq>0&&sq<2000?sq:0,v:offVec(mac,mic),mic:Object.keys(mic).some(k=>k!=="na")};
}
function codeVariants(c){const s=new Set([c]);if(c.length===12)s.add("0"+c);if(c.length===13&&c[0]==="0")s.add(c.slice(1));return [...s];}
async function lookupCode(code,meal,back){
  code=code.replace(/\D/g,"");
  const cu=S.custom.find(x=>x.ean&&codeVariants(code).includes(x.ean)); if(cu){openPortion(cu.id,{meal,back});return;}
  for(const c of codeVariants(code)) if(offRow(c)){openPortion("o:"+c,{meal,back});return;}
  sheet("Söker vara…",`<p class="note">Letar efter streckkod ${esc(code)} i Open Food Facts…</p>`,back);
  let found=null;
  try{
    const r=await fetch(`https://world.openfoodfacts.org/api/v2/product/${code}?fields=${OFF_FIELDS}`);
    const d=await r.json(); if(d&&d.status===1) found=offFromProduct(d.product);
  }catch(e){
    openCustom(null,{ean:code,meal,back,why:"Du verkar vara offline, så varan kunde inte slås upp. Skriv av näringsvärdena från förpackningen så sparas varan med streckkoden."});return;
  }
  if(found&&!found.incomplete){S.prod[code]=found;touch("profile");openPortion("o:"+code,{meal,back});return;}
  openCustom(null,{ean:code,meal,back,name:found?[found.name,found.brand].filter(Boolean).join(", "):"",why:found?"Varan finns i Open Food Facts men saknar näringsvärden. Skriv av dem från förpackningen.":"Varan finns inte i databasen än. Skriv av näringsvärdena från förpackningen så hittas den direkt nästa gång."});
}
async function searchOnline(q,meal,back){
  const box=$("#online"); if(!box) return;
  box.innerHTML=`<p class="note">Söker i Open Food Facts…</p>`;
  try{
    const r=await fetch(`https://world.openfoodfacts.org/cgi/search.pl?search_terms=${encodeURIComponent(q)}&search_simple=1&action=process&json=1&page_size=24&fields=${OFF_FIELDS}`);
    const d=await r.json(); const list=(d.products||[]).map(p=>[String(p.code||""),offFromProduct(p)]).filter(([c,o])=>c&&o&&!o.incomplete);
    if(!$("#online")) return;
    if(!list.length){box.innerHTML=`<p class="note">Inget hittades online heller. Skanna streckkoden eller lägg till varan själv under Mål.</p>`;return;}
    const tmp=new Map(list);
    box.innerHTML=`<div class="lbl" style="margin-bottom:6px">Från Open Food Facts</div><div class="res">${list.map(([c,o])=>`<button data-oc="${esc(c)}"><div class="n"><div>${esc(o.name)}${o.brand?`, ${esc(o.brand)}`:""}</div><div class="num">${fmt(o.v[0])} kcal · P ${fmt(o.v[1],1)} · K ${fmt(o.v[2],1)} · F ${fmt(o.v[3],1)} /100 g</div></div></button>`).join("")}</div>`;
    box.querySelectorAll("[data-oc]").forEach(b=>b.onclick=()=>{const c=b.dataset.oc;S.prod[c]=tmp.get(c);touch("profile");openPortion("o:"+c,{meal,back});});
  }catch(e){box.innerHTML=`<p class="note">Kunde inte nå Open Food Facts. Kontrollera att du har nät och försök igen.</p>`;}
}

/* ---------- Barcode scanner ---------- */
let scanner=null, scanLib=null;
function loadScanLib(){
  if(window.Html5Qrcode) return Promise.resolve();
  if(!scanLib) scanLib=new Promise((res,rej)=>{const s=document.createElement("script");s.src="vendor/html5-qrcode.min.js";s.onload=res;s.onerror=()=>{scanLib=null;rej();};document.head.appendChild(s);});
  return scanLib;
}
function stopScan(){const s=scanner;scanner=null;if(s){try{s.stop().catch(()=>{}).finally(()=>{try{s.clear();}catch(e){}});}catch(e){}}}
async function openScan(meal){
  const back=()=>{stopScan();openAdd(meal);};
  sheet("Skanna streckkod",`<div id="reader"></div>
  <p class="note" id="scanMsg" style="margin:0">Håll streckkoden i rutan. Den läses av automatiskt.</p>
  <div class="field"><label for="manCode">Eller skriv siffrorna under streckkoden</label><div class="searchrow"><input id="manCode" type="text" inputmode="numeric" pattern="[0-9]*" placeholder="t.ex. 7310865004703"><button class="btn" id="manGo">Sök</button></div></div>`,back);
  const done=code=>{stopScan();lookupCode(code,meal,back);};
  $("#manGo").onclick=()=>{const c=$("#manCode").value.replace(/\D/g,"");if(c.length>=8)done(c);else toast("En streckkod har minst 8 siffror");};
  try{await loadScanLib();}catch(e){$("#scanMsg").textContent="Skannern kunde inte laddas. Skriv in siffrorna i stället.";return;}
  if(!$("#reader")) return;
  const F=Html5QrcodeSupportedFormats;
  const s=new Html5Qrcode("reader",{formatsToSupport:[F.EAN_13,F.EAN_8,F.UPC_A,F.UPC_E],experimentalFeatures:{useBarCodeDetectorIfSupported:true},verbose:false});
  scanner=s; let hit=false;
  try{
    await s.start({facingMode:"environment"},{fps:12,qrbox:(w,h)=>({width:Math.min(300,Math.floor(w*.85)),height:Math.min(160,Math.floor(h*.5))}),aspectRatio:1.333},
      text=>{if(hit) return; const c=String(text).replace(/\D/g,""); if(c.length<8) return; hit=true; if(navigator.vibrate) navigator.vibrate(60); done(c);},()=>{});
    if(scanner!==s){try{await s.stop();s.clear();}catch(e){}}
  }catch(e){
    scanner=null;
    const m=$("#scanMsg"); if(m) m.textContent="Appen fick inte använda kameran. Tillåt kameran för den här sidan i Safari (aA-menyn → Webbplatsinställningar) eller skriv in siffrorna nedan.";
  }
}

let toastT; function toast(msg){$("#toastRoot").innerHTML=`<div class="toast" role="status">${esc(msg)}</div>`;clearTimeout(toastT);toastT=setTimeout(()=>$("#toastRoot").innerHTML="",2400);}

/* ---------- Wire up ---------- */
document.querySelectorAll("nav.tabs [data-tab]").forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render();window.scrollTo(0,0);});
$("#plusBtn").onclick=()=>openAdd();
$("#prevDay").onclick=()=>{day=addDays(day,-1);render();};
$("#nextDay").onclick=()=>{day=addDays(day,1);render();};
$("#dateLbl").onclick=()=>{day=todayKey();render();};
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&root.innerHTML)closeSheet();});

render();
fetch("foods.json").then(r=>r.json()).then(d=>{
  KEYS=d.keys;
  for(const r of d.foods){const [nr,name,...v]=r;FOODS.set(nr,{name,v});FLIST.push({fid:nr,name,nn:norm(name)});}
  foodsReady=true; render(); if(root.innerHTML&&$("#q")) $("#q").dispatchEvent(new Event("input"));
  return fetch("off.json").then(r=>r.json()).then(o=>{
    for(const [code,name,brand,sq,mac,mic] of o.rows){
      OFF.set(code,{name,brand,sq,v:offVec(mac,mic),mic:!!mic&&Object.keys(mic).some(k=>k!=="na")});
      OLIST.push({fid:"o:"+code,name,off:true,nn:norm(name+" "+brand)});
    }
    offReady=true; render(); if(root.innerHTML&&$("#q")) $("#q").dispatchEvent(new Event("input"));
  }).catch(()=>{offReady=true;});
}).catch(()=>toast("Kunde inte ladda livsmedelsdatabasen. Ladda om sidan."));
if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});
if(navigator.storage&&navigator.storage.persist) navigator.storage.persist().catch(()=>{});
})();
